<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utilities</title>
<meta name="description" content="A calm set of everyday utilities: JSON/YAML/CSV converter, regex playground, diff viewer, encoder toolbox, habit grid and workout logger. Runs entirely in your browser.">
<meta name="theme-color" content="#f7f7f5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2318181b'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.2'%3E%3Crect x='8' y='8' width='6.5' height='6.5' rx='1.6'/%3E%3Crect x='17.5' y='8' width='6.5' height='6.5' rx='1.6'/%3E%3Crect x='8' y='17.5' width='6.5' height='6.5' rx='1.6'/%3E%3Crect x='17.5' y='17.5' width='6.5' height='6.5' rx='1.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Resolve the theme before first paint so there is no flash.
  (function () {
    var t = null;
    try { var s = JSON.parse(localStorage.getItem('util-app/settings') || '{}'); t = s.theme; } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="top-left">
        <a class="brand" href="#/" aria-label="Utilities home">
          <span class="brand-mark" id="brandMark"></span>
          <span>Utilities</span>
        </a>
        <div class="crumb" id="crumb"></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" title="Toggle dark mode (T)" aria-label="Toggle dark mode"></button>
        <div class="menu-wrap">
          <button class="icon-btn" id="moreBtn" title="More" aria-label="More options"></button>
        </div>
      </div>
    </header>
    <main id="view"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript><p style="text-align:center;padding:40px">Utilities needs JavaScript to run.</p></noscript>

  <!-- Core first, then each tool registers itself. Order here is the order on the home page. -->
  <script src="js/app.js"></script>
  <script src="js/lib/formats.js"></script>
  <script src="js/lib/md5.js"></script>
  <script src="js/tools/json.js"></script>
  <script src="js/tools/regex.js"></script>
  <script src="js/tools/diff.js"></script>
  <script src="js/tools/encode.js"></script>
  <script src="js/tools/habits.js"></script>
  <script src="js/tools/workouts.js"></script>
</body>
</html>
